<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Foto Kita Blur</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0a0f; --surface: #12121a; --border: rgba(255,255,255,0.07);
      --accent: #c8ff00; --accent2: #7c3aed; --text: #e8e8f0; --muted: #52526a;
      --danger: #ff3b3b; --r: 14px;
      --font-ui: 'Space Grotesk', sans-serif; --font-mono: 'Space Mono', monospace;
    }
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: var(--font-ui); background: var(--bg); color: var(--text);
      min-height: 100vh; display: flex; flex-direction: column;
      align-items: center; padding: 24px 16px 40px; overflow-x: hidden;
    }
    header {
      width: 100%; max-width: 960px; display: flex; align-items: baseline;
      gap: 16px; margin-bottom: 20px; opacity: 0; transform: translateY(-16px);
    }
    .logo { font-size: 1.5rem; font-weight: 700; letter-spacing: -0.03em; }
    .logo span { color: var(--accent); }
    .tagline { font-size: 0.8rem; color: var(--muted); letter-spacing: 0.06em; text-transform: uppercase; }
    #stage {
      position: relative; width: 100%; max-width: 960px; background: #000;
      border-radius: var(--r); overflow: hidden; border: 1px solid var(--border);
      opacity: 0; transform: translateY(20px);
    }
    canvas { display: block; width: 100%; height: auto; min-height: 200px; }
    #idle {
      position: absolute; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 12px;
      background: #000; transition: opacity 0.4s;
    }
    #idle.hidden { opacity: 0; pointer-events: none; }
    .idle-icon { font-size: 3rem; }
    .idle-text { font-size: 0.85rem; color: var(--muted); letter-spacing: 0.05em; }
    #blurGlow {
      position: absolute; inset: 0; pointer-events: none; border-radius: var(--r);
      box-shadow: inset 0 0 0 0 var(--accent); transition: box-shadow 0.3s;
    }
    #blurGlow.active { box-shadow: inset 0 0 60px 10px rgba(200,255,0,0.12); }
    #peaceBadge {
      position: absolute; top: 16px; left: 50%;
      transform: translateX(-50%) translateY(-60px);
      background: var(--accent); color: #000; font-size: 0.7rem; font-weight: 700;
      letter-spacing: 0.12em; text-transform: uppercase; padding: 5px 14px;
      border-radius: 100px; pointer-events: none; opacity: 0;
    }
    /* Filter badge */
    #filterBadge {
      position: absolute; top: 16px; right: 16px;
      background: rgba(0,0,0,0.7); color: var(--accent);
      font-family: var(--font-mono); font-size: 0.75rem; font-weight: 700;
      letter-spacing: 0.1em; padding: 6px 14px; border-radius: 6px;
      border: 1px solid var(--accent); pointer-events: none;
      display: none;
    }
    /* Gesture hint overlay */
    #gestureHint {
      position: absolute; bottom: 56px; left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.75); color: #fff;
      font-size: 0.75rem; padding: 4px 12px; border-radius: 6px;
      pointer-events: none; display: none; white-space: nowrap;
    }
    #controls {
      width: 100%; max-width: 960px; margin-top: 16px;
      display: flex; gap: 10px; flex-wrap: wrap; opacity: 0; transform: translateY(12px);
    }
    .btn {
      font-family: var(--font-ui); font-size: 0.85rem; font-weight: 600;
      letter-spacing: 0.03em; padding: 11px 22px; border: 1px solid var(--border);
      border-radius: 8px; cursor: pointer; background: var(--surface); color: var(--text);
      transition: background 0.15s, border-color 0.15s; display: flex;
      align-items: center; gap: 8px; white-space: nowrap;
    }
    .btn:hover { background: #1e1e2e; border-color: rgba(255,255,255,0.15); }
    .btn:active { transform: scale(0.97); }
    .btn:disabled { opacity: 0.35; cursor: not-allowed; }
    .btn-primary { background: var(--accent); color: #000; border-color: var(--accent); }
    .btn-primary:hover { background: #d4ff1a; border-color: #d4ff1a; }
    .btn-danger { background: var(--danger); color: #fff; border-color: var(--danger); animation: recPulse 1.2s infinite; }
    @keyframes recPulse { 0%,100%{opacity:1} 50%{opacity:.75} }
    #statusBar {
      width: 100%; max-width: 960px; margin-top: 12px;
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      font-family: var(--font-mono); font-size: 0.72rem; color: var(--muted); opacity: 0;
    }
    #statusMsg { flex: 1; }
    #statusRight { display: flex; gap: 16px; }
    .stat { display: flex; gap: 6px; align-items: center; }
    .stat-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); }
    .stat-dot.on { background: var(--accent); box-shadow: 0 0 6px var(--accent); }
    #hint {
      margin-top: 24px; width: 100%; max-width: 960px;
      display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 10px; opacity: 0;
    }
    .hint-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--r); padding: 14px; display: flex; gap: 10px; align-items: flex-start;
    }
    .hint-num { font-family: var(--font-mono); font-size: 0.65rem; color: var(--accent); letter-spacing: 0.1em; padding-top: 2px; flex-shrink: 0; }
    .hint-text { font-size: 0.78rem; color: var(--muted); line-height: 1.5; }
    .hint-text strong { color: var(--text); font-weight: 500; }
  </style>
</head>
<body>
  <header id="header">
    <div class="logo">Foto Kita <span>Blur</span></div>
    <div class="tagline">gesture camera • web</div>
  </header>

  <div id="stage">
    <canvas id="canvas"></canvas>
    <div id="idle">
      <div class="idle-icon">✌️</div>
      <div class="idle-text">Klik Start untuk mulai</div>
    </div>
    <div id="blurGlow"></div>
    <div id="peaceBadge">BLUR AKTIF</div>
    <div id="filterBadge">NONE</div>
    <div id="gestureHint"></div>
  </div>

  <div id="controls">
    <button class="btn btn-primary" id="startBtn"><span>▶</span> Start</button>
    <button class="btn" id="recordBtn" disabled><span>⏺</span> Record</button>
  </div>

  <div id="statusBar">
    <span id="statusMsg">—</span>
    <div id="statusRight">
      <div class="stat"><div class="stat-dot" id="dotCam"></div><span id="statCam">kamera off</span></div>
      <div class="stat"><div class="stat-dot" id="dotRec"></div><span id="statRec">—</span></div>
      <div class="stat"><span id="statTimer">00:00</span></div>
    </div>
  </div>

  <div id="hint">
    <div class="hint-card"><div class="hint-num">01</div><div class="hint-text"><strong>✌️ Peace</strong> — blur aktif</div></div>
    <div class="hint-card"><div class="hint-num">02</div><div class="hint-text"><strong>✊ Kepal</strong> — Hidup Jokowi!</div></div>
    <div class="hint-card"><div class="hint-num">03</div><div class="hint-text"><strong>👊 Gebrak</strong> — Antek Aseng!</div></div>
    <div class="hint-card"><div class="hint-num">04</div><div class="hint-text"><strong>👌 Cubit</strong> (2 tangan) — ganti filter</div></div>
    <div class="hint-card"><div class="hint-num">05</div><div class="hint-text"><strong>Portal</strong> — 4 titik (thumb+index 2 tangan)</div></div>
    <div class="hint-card"><div class="hint-num">06</div><div class="hint-text"><strong>Record</strong> — video auto-download</div></div>
  </div>

  <script type="module">
    import { animate, createTimeline, stagger } from 'https://cdn.jsdelivr.net/npm/animejs/+esm';
    import { HandLandmarker, FilesetResolver } from 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14';

    // ═══ CONFIG ═══
    const BLUR_FADE  = 0.12;
    const MAX_HANDS  = 4;
    const CONF       = 0.7;
    const MAX_BLUR   = 22;
    const FILTERS    = ['NONE','MONO','DUAL-TONE','PIXELATE','INVERT','SEPIA','BLUR','THERMAL','SKETCH','GLITCH','NEON','GALAXY'];
    const PORTAL_DIST = 50; // px — jarak thumb+index untuk portal trigger

    // ═══ DOM ═══
    const canvas       = document.getElementById('canvas');
    const ctx          = canvas.getContext('2d');
    const startBtn     = document.getElementById('startBtn');
    const recordBtn    = document.getElementById('recordBtn');
    const idle         = document.getElementById('idle');
    const blurGlow     = document.getElementById('blurGlow');
    const peaceBadge   = document.getElementById('peaceBadge');
    const filterBadge  = document.getElementById('filterBadge');
    const gestureHint  = document.getElementById('gestureHint');
    const statusMsg    = document.getElementById('statusMsg');
    const dotCam       = document.getElementById('dotCam');
    const dotRec       = document.getElementById('dotRec');
    const statCam      = document.getElementById('statCam');
    const statRec      = document.getElementById('statRec');
    const statTimer    = document.getElementById('statTimer');

    // ═══ STATE ═══
    let video, handLandmarker;
    let animId;
    let blurAmount = 0, wasBlur = false;
    let recording = false;
    let mediaRecorder, chunks = [];
    let startTime = 0, timerInterval;
    let currentFilter = 0;
    let gestureTriggered = false;
    let wasFist = false, wasSlam = false;

    // Galaxy background (generate sekali)
    const galaxyCanvas = document.createElement('canvas');
    galaxyCanvas.width = 1280; galaxyCanvas.height = 720;
    const gCtx = galaxyCanvas.getContext('2d');
    gCtx.fillStyle = 'rgb(30,10,40)';
    gCtx.fillRect(0, 0, 1280, 720);
    for (let i = 0; i < 800; i++) {
      gCtx.fillStyle = '#fff';
      gCtx.fillRect(Math.random()*1280, Math.random()*720, 1, 1);
    }
    for (let i = 0; i < 100; i++) {
      const r = Math.floor(Math.random()*4+2);
      const h = Math.floor(Math.random()*60+150);
      gCtx.fillStyle = `hsl(${h},100%,70%)`;
      gCtx.beginPath();
      gCtx.arc(Math.random()*1280, Math.random()*720, r, 0, Math.PI*2);
      gCtx.fill();
    }

    // OffscreenCanvas untuk filter per-pixel
    let offscreen = null, offCtx = null;
    function ensureOffscreen(w, h) {
      if (!offscreen || offscreen.width !== w || offscreen.height !== h) {
        offscreen = new OffscreenCanvas(w, h);
        offCtx = offscreen.getContext('2d');
      }
    }

    // ═══ AUDIO ═══
    let audioCtx = null;
    let musicBuffer = null, musicSource = null;
    let jokowiBuffer = null, jokowiSource = null, jokowiCooldown = 0;
    let antekBuffer = null, antekSource = null, antekCooldown = 0;

    async function loadAudio(path) {
      try {
        const res = await fetch(path);
        if (!res.ok) return null;
        if (!audioCtx) audioCtx = new AudioContext();
        return await audioCtx.decodeAudioData(await res.arrayBuffer());
      } catch(e) { console.warn('[Audio]', path, e.message); return null; }
    }
    function playBuffer(buf, loop = false) {
      if (!buf || !audioCtx) return null;
      const src = audioCtx.createBufferSource();
      src.buffer = buf; src.loop = loop;
      src.connect(audioCtx.destination); src.start(0);
      return src;
    }
    function stopSource(src) { if (src) try { src.stop(); } catch(_){} }

    function startMusic() { musicSource = playBuffer(musicBuffer, true); }
    function stopMusic()  { stopSource(musicSource); musicSource = null; }

    function playJokowi() {
      if (!jokowiBuffer || Date.now() < jokowiCooldown) return;
      stopSource(jokowiSource);
      jokowiSource = playBuffer(jokowiBuffer);
      jokowiCooldown = Date.now() + jokowiBuffer.duration * 1000 + 500;
    }
    function playAntek() {
      if (!antekBuffer || Date.now() < antekCooldown) return;
      stopSource(antekSource);
      antekSource = playBuffer(antekBuffer);
      antekCooldown = Date.now() + antekBuffer.duration * 1000 + 500;
    }

    // ═══ MEDIAPIPE ═══
    async function initMP() {
      const vision = await FilesetResolver.forVisionTasks(
        'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm'
      );
      handLandmarker = await HandLandmarker.createFromOptions(vision, {
        baseOptions: {
          modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/latest/hand_landmarker.task',
          delegate: 'GPU'
        },
        runningMode: 'VIDEO', numHands: MAX_HANDS,
        minHandDetectionConfidence: CONF,
        minHandPresenceConfidence: CONF,
        minTrackingConfidence: CONF
      });
    }

    // ═══ GESTURE DETECTION ═══
    function isPeace(lm) {
      return lm[8].y < lm[6].y && lm[12].y < lm[10].y &&
             lm[16].y > lm[14].y && lm[20].y > lm[18].y;
    }
    function isFist(lm) {
      return lm[8].y > lm[7].y && lm[8].y > lm[5].y &&
             lm[12].y > lm[11].y && lm[12].y > lm[9].y &&
             lm[16].y > lm[15].y && lm[16].y > lm[13].y &&
             lm[20].y > lm[19].y && lm[20].y > lm[17].y;
    }
    function isPinch(lm) {
      const tx = lm[4].x, ty = lm[4].y;
      const ix = lm[8].x, iy = lm[8].y;
      return Math.hypot(tx - ix, ty - iy) < 0.06;
    }
    function dist2d(a, b, w, h) {
      return Math.hypot((a.x - b.x)*w, (a.y - b.y)*h);
    }

    // Slam detector
    const slamHist = [];
    function detectSlam(lm) {
      const now = performance.now();
      slamHist.push({ y: lm[0].y, t: now });
      while (slamHist.length > 0 && now - slamHist[0].t > 500) slamHist.shift();
      if (slamHist.length < 3) return false;
      let maxDown = 0, maxUp = 0;
      for (let i = 1; i < slamHist.length; i++) {
        const dt = (slamHist[i].t - slamHist[i-1].t) / 1000;
        if (dt <= 0) continue;
        const vel = (slamHist[i].y - slamHist[i-1].y) / dt;
        if (vel > 0) maxDown = Math.max(maxDown, vel);
        else         maxUp   = Math.max(maxUp, -vel);
      }
      return maxDown > 0.4 && maxUp > 0.2;
    }

    // ═══ FILTER ENGINE ═══
    function applyFilterToImageData(imgData, filterName, w, h) {
      const d = imgData.data;
      const len = d.length;

      if (filterName === 'MONO') {
        for (let i = 0; i < len; i += 4) {
          const g = d[i]*0.299 + d[i+1]*0.587 + d[i+2]*0.114;
          d[i] = d[i+1] = d[i+2] = g;
        }
      } else if (filterName === 'INVERT') {
        for (let i = 0; i < len; i += 4) {
          d[i] = 255-d[i]; d[i+1] = 255-d[i+1]; d[i+2] = 255-d[i+2];
        }
      } else if (filterName === 'SEPIA') {
        for (let i = 0; i < len; i += 4) {
          const r=d[i], g=d[i+1], b=d[i+2];
          d[i]   = Math.min(255, r*0.393 + g*0.769 + b*0.189);
          d[i+1] = Math.min(255, r*0.349 + g*0.686 + b*0.168);
          d[i+2] = Math.min(255, r*0.272 + g*0.534 + b*0.131);
        }
      } else if (filterName === 'DUAL-TONE') {
        for (let i = 0; i < len; i += 4) {
          const g = d[i]*0.299 + d[i+1]*0.587 + d[i+2]*0.114;
          if (g > 127) { d[i]=255; d[i+1]=165; d[i+2]=0; }
          else         { d[i]=147; d[i+1]=20;  d[i+2]=255; }
        }
      } else if (filterName === 'THERMAL') {
        for (let i = 0; i < len; i += 4) {
          const g = d[i]*0.299 + d[i+1]*0.587 + d[i+2]*0.114;
          const t = g / 255;
          d[i]   = Math.min(255, t < 0.5 ? 0 : (t-0.5)*2*255);
          d[i+1] = Math.min(255, t < 0.25 ? t*4*255 : t > 0.75 ? (1-t)*4*255 : 255);
          d[i+2] = Math.min(255, t < 0.5 ? (0.5-t)*2*255 : 0);
        }
      } else if (filterName === 'GLITCH') {
        const shift = Math.max(5, Math.floor(w / 20));
        const tmp = new Uint8ClampedArray(d);
        for (let y2 = 0; y2 < h; y2++) {
          for (let x2 = 0; x2 < w - shift; x2++) {
            const i = (y2*w + x2)*4;
            const j = (y2*w + x2 + shift)*4;
            d[i+2] = tmp[j+2];
          }
          for (let x2 = shift; x2 < w; x2++) {
            const i = (y2*w + x2)*4;
            const j = (y2*w + x2 - shift)*4;
            d[i] = tmp[j];
          }
        }
      } else if (filterName === 'PIXELATE') {
        const bsz = 10;
        for (let y2 = 0; y2 < h; y2 += bsz) {
          for (let x2 = 0; x2 < w; x2 += bsz) {
            const si = (y2*w + x2)*4;
            const pr = d[si], pg = d[si+1], pb = d[si+2];
            for (let dy = 0; dy < bsz && y2+dy < h; dy++) {
              for (let dx = 0; dx < bsz && x2+dx < w; dx++) {
                const ci = ((y2+dy)*w + x2+dx)*4;
                d[ci]=pr; d[ci+1]=pg; d[ci+2]=pb;
              }
            }
          }
        }
      } else if (filterName === 'SKETCH') {
        const gray = new Uint8ClampedArray(len/4);
        for (let i = 0; i < len; i += 4)
          gray[i/4] = d[i]*0.299 + d[i+1]*0.587 + d[i+2]*0.114;
        for (let i = 0; i < len; i += 4) {
          const idx = i/4;
          const x2 = idx % w, y2 = Math.floor(idx / w);
          const ni = x2 < w-1 ? idx+1 : idx;
          const mi = y2 < h-1 ? idx+w : idx;
          const edge = Math.min(255, Math.abs(gray[idx]-gray[ni])*3 + Math.abs(gray[idx]-gray[mi])*3);
          const s = 255 - edge;
          d[i] = d[i+1] = d[i+2] = s;
        }
      } else if (filterName === 'NEON') {
        const gray = new Uint8ClampedArray(len/4);
        for (let i = 0; i < len; i += 4)
          gray[i/4] = d[i]*0.299 + d[i+1]*0.587 + d[i+2]*0.114;
        for (let i = 0; i < len; i += 4) {
          const idx = i/4;
          const x2 = idx % w, y2 = Math.floor(idx / w);
          const ni = x2 < w-1 ? idx+1 : idx;
          const mi = y2 < h-1 ? idx+w : idx;
          const edge = Math.min(255, (Math.abs(gray[idx]-gray[ni]) + Math.abs(gray[idx]-gray[mi]))*4);
          d[i] = 0; d[i+1] = edge; d[i+2] = edge;
        }
      } else if (filterName === 'GALAXY') {
        // Blend dengan galaxy bg — simple luminance-based key
        const gData = gCtx.getImageData(0, 0, Math.min(w, 1280), Math.min(h, 720)).data;
        for (let i = 0; i < len; i += 4) {
          const g = d[i]*0.299 + d[i+1]*0.587 + d[i+2]*0.114;
          const gi = Math.min(i, gData.length-4);
          const alpha = g < 80 ? 1 : g < 160 ? (160-g)/80 : 0;
          d[i]   = d[i]   * (1-alpha) + gData[gi]   * alpha;
          d[i+1] = d[i+1] * (1-alpha) + gData[gi+1] * alpha;
          d[i+2] = d[i+2] * (1-alpha) + gData[gi+2] * alpha;
        }
      }
    }

    // ═══ HAND DRAWING ═══
    const CONNECTIONS = [
      [0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],
      [5,9],[9,10],[10,11],[11,12],[9,13],[13,14],[14,15],[15,16],
      [13,17],[17,18],[18,19],[19,20],[0,17]
    ];

    function drawHand(lm, peace, w, h) {
      const pts = lm.map(p => ({ x: (1-p.x)*w, y: p.y*h }));
      const col = peace ? '#c8ff00' : 'rgba(255,255,255,0.5)';
      ctx.strokeStyle = peace ? 'rgba(200,255,0,0.4)' : 'rgba(255,255,255,0.15)';
      ctx.lineWidth = peace ? 2.5 : 1.5; ctx.lineCap = 'round';
      for (const [a,b] of CONNECTIONS) {
        ctx.beginPath(); ctx.moveTo(pts[a].x, pts[a].y);
        ctx.lineTo(pts[b].x, pts[b].y); ctx.stroke();
      }
      for (const [i, pt] of pts.entries()) {
        const isTip = [4,8,12,16,20].includes(i);
        const isActive = peace && (i===8||i===12);
        ctx.beginPath();
        ctx.arc(pt.x, pt.y, isActive ? 8 : isTip ? 5 : 3, 0, Math.PI*2);
        ctx.fillStyle = isActive ? '#c8ff00' : col;
        ctx.fill();
        if (isActive) {
          ctx.beginPath(); ctx.arc(pt.x, pt.y, 13, 0, Math.PI*2);
          ctx.strokeStyle = 'rgba(200,255,0,0.3)'; ctx.lineWidth = 1.5; ctx.stroke();
        }
      }
    }

    // Draw portal polygon with filter
    function drawPortal(pts4, w, h) {
      if (pts4.length !== 4) return;
      // Sort: top2 dan bottom2
      const sorted = [...pts4].sort((a,b) => a.y - b.y);
      const top = sorted.slice(0,2).sort((a,b) => a.x - b.x);
      const bot = sorted.slice(2).sort((a,b) => a.x - b.x);
      const poly = [top[0], top[1], bot[1], bot[0]];

      // Clip ke polygon, apply filter, draw
      const minX = Math.max(0, Math.min(...poly.map(p=>p.x)));
      const minY = Math.max(0, Math.min(...poly.map(p=>p.y)));
      const maxX = Math.min(w, Math.max(...poly.map(p=>p.x)));
      const maxY = Math.min(h, Math.max(...poly.map(p=>p.y)));
      const bw = maxX - minX, bh = maxY - minY;
      if (bw < 10 || bh < 10) return;

      // Get pixel data dari region
      const imgData = ctx.getImageData(minX, minY, bw, bh);
      applyFilterToImageData(imgData, FILTERS[currentFilter], bw, bh);

      // Draw ke offscreen
      ensureOffscreen(bw, bh);
      offCtx.putImageData(imgData, 0, 0);

      // Clip polygon lalu draw filtered region
      ctx.save();
      ctx.beginPath();
      ctx.moveTo(poly[0].x, poly[0].y);
      for (let i = 1; i < poly.length; i++) ctx.lineTo(poly[i].x, poly[i].y);
      ctx.closePath(); ctx.clip();
      ctx.drawImage(offscreen, minX, minY);
      ctx.restore();

      // Border portal
      ctx.beginPath();
      ctx.moveTo(poly[0].x, poly[0].y);
      for (let i = 1; i < poly.length; i++) ctx.lineTo(poly[i].x, poly[i].y);
      ctx.closePath();
      ctx.strokeStyle = 'rgba(200,255,0,0.8)'; ctx.lineWidth = 2; ctx.stroke();

      // Partikel glow di tepi
      for (let i = 0; i < 4; i++) {
        const p1 = poly[i], p2 = poly[(i+1)%4];
        for (let j = 0; j < 4; j++) {
          const alpha = Math.random();
          const px = p1.x*alpha + p2.x*(1-alpha) + (Math.random()-0.5)*20;
          const py = p1.y*alpha + p2.y*(1-alpha) + (Math.random()-0.5)*20;
          ctx.beginPath(); ctx.arc(px, py, Math.random()*3+1, 0, Math.PI*2);
          ctx.fillStyle = `hsla(${Math.random()*60+60},100%,70%,${Math.random()*0.8+0.2})`;
          ctx.fill();
        }
      }

      // Label
      ctx.fillStyle = '#c8ff00'; ctx.font = 'bold 13px "Space Grotesk", sans-serif';
      ctx.fillText(`PORTAL: ${FILTERS[currentFilter]}`, poly[0].x, poly[0].y - 10);
    }

    // ═══ MAIN LOOP ═══
    function loop() {
      if (!video || video.readyState < 2) { animId = requestAnimationFrame(loop); return; }
      const w = video.videoWidth, h = video.videoHeight;
      if (canvas.width !== w) canvas.width = w;
      if (canvas.height !== h) canvas.height = h;

      const result = handLandmarker.detectForVideo(video, performance.now());

      // ─ Hitung gesture state ─
      let peaceCount = 0, fistCount = 0, pinchCount = 0;
      let portalPts = []; // thumb+index dari semua tangan
      let changeFilter = false;

      if (result.landmarks?.length) {
        for (const lm of result.landmarks) {
          if (isPeace(lm)) peaceCount++;
          if (isFist(lm)) fistCount++;
          if (isPinch(lm)) pinchCount++;

          // Titik thumb (4) dan index (8) untuk portal
          const tx = (1-lm[4].x)*w, ty = lm[4].y*h;
          const ix = (1-lm[8].x)*w, iy = lm[8].y*h;
          if (dist2d(lm[4], lm[8], w, h) < PORTAL_DIST) {
            portalPts.push({ x: tx, y: ty });
          }
        }

        // Ganti filter: 2 tangan sama-sama pinch
        if (result.landmarks.length >= 2) {
          const idx0 = result.landmarks[0][8];
          const idx1 = result.landmarks[1][8];
          if (dist2d(idx0, idx1, w, h) < 40) changeFilter = true;
        }
        // Atau 1 tangan: thumb+pinky ketemu
        for (const lm of result.landmarks) {
          if (dist2d(lm[4], lm[20], w, h) < 40) changeFilter = true;
        }
        if (changeFilter) {
          if (!gestureTriggered) {
            currentFilter = (currentFilter + 1) % FILTERS.length;
            gestureTriggered = true;
            showHint(`Filter: ${FILTERS[currentFilter]}`);
            filterBadge.textContent = FILTERS[currentFilter];
            filterBadge.style.display = currentFilter > 0 ? 'block' : 'none';
            animate(filterBadge, { scale: [1.15, 1], duration: 300, ease: 'outBack' });
          }
        } else { gestureTriggered = false; }
      }

      // ─ Blur (peace) ─
      const target = peaceCount > 0 ? 1 : 0;
      blurAmount += (target - blurAmount) * BLUR_FADE;
      blurAmount = Math.max(0, Math.min(1, blurAmount));
      const blurPx = blurAmount * MAX_BLUR;

      // ─ Draw video ─
      ctx.save();
      ctx.filter = blurPx > 0.3 ? `blur(${blurPx.toFixed(1)}px)` : 'none';
      ctx.translate(w, 0); ctx.scale(-1, 1);
      ctx.drawImage(video, 0, 0, w, h);
      ctx.restore();
      ctx.filter = 'none';

      // ─ Portal filter (4 titik = 2 tangan masing-masing pinch) ─
      if (portalPts.length === 4) {
        drawPortal(portalPts, w, h);
      } else if (portalPts.length === 0 && currentFilter > 0 && result.landmarks?.length > 0) {
        // Apply filter ke seluruh frame kalau ga ada portal tapi filter aktif
        const imgData = ctx.getImageData(0, 0, w, h);
        applyFilterToImageData(imgData, FILTERS[currentFilter], w, h);
        ctx.putImageData(imgData, 0, 0);
      }

      // ─ Draw hands ─
      if (result.landmarks?.length) {
        for (const lm of result.landmarks) drawHand(lm, isPeace(lm), w, h);
      }

      // ─ HUD ─
      drawHud(w, h);

      // ─ Side effects ─
      const nowBlur = blurAmount > 0.3;
      if (nowBlur !== wasBlur) {
        blurGlow.classList.toggle('active', nowBlur);
        if (nowBlur) showBadge(); else hideBadge();
        wasBlur = nowBlur;
      }

      // Fist → Jokowi
      const nowFist = fistCount > 0;
      if (nowFist && !wasFist) playJokowi();
      wasFist = nowFist;

      // Slam → Antek
      if (result.landmarks?.length) {
        const nowSlam = result.landmarks.some(lm => detectSlam(lm));
        if (nowSlam && !wasSlam) playAntek();
        wasSlam = nowSlam;
      } else { wasSlam = false; }

      animId = requestAnimationFrame(loop);
    }

    function drawHud(w, h) {
      const elapsed = Math.floor((Date.now() - startTime) / 1000);
      const mm = String(Math.floor(elapsed/60)).padStart(2,'0');
      const ss = String(elapsed%60).padStart(2,'0');
      ctx.font = '13px "Space Mono", monospace';
      ctx.fillStyle = 'rgba(255,255,255,0.5)';
      ctx.fillText(`${mm}:${ss}`, w-58, h-14);
      if (recording && Math.floor(Date.now()/600)%2 === 0) {
        ctx.beginPath(); ctx.arc(w-72, h-20, 5, 0, Math.PI*2);
        ctx.fillStyle = '#ff3b3b'; ctx.fill();
      }
    }

    // ─ Badge anime ─
    let badgeAnim;
    function showBadge() {
      if (badgeAnim) badgeAnim.cancel();
      peaceBadge.style.opacity = '1';
      badgeAnim = animate(peaceBadge, { translateX:['-50%','-50%'], translateY:['-60px','0px'], duration:400, ease:'outBack' });
    }
    function hideBadge() {
      if (badgeAnim) badgeAnim.cancel();
      badgeAnim = animate(peaceBadge, {
        translateX:['-50%','-50%'], translateY:['0px','-60px'], duration:300, ease:'inQuart',
        onComplete: () => { peaceBadge.style.opacity = '0'; }
      });
    }

    let hintTimer;
    function showHint(msg) {
      gestureHint.textContent = msg;
      gestureHint.style.display = 'block';
      clearTimeout(hintTimer);
      hintTimer = setTimeout(() => { gestureHint.style.display = 'none'; }, 2000);
    }

    // ═══ CAMERA ═══
    async function startCamera() {
      try {
        setStatus('Memuat MediaPipe...');
        await initMP();
        setStatus('Menyalakan kamera...');
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { width: 1280, height: 720, facingMode: 'user' }, audio: false
        });
        video = document.createElement('video');
        video.srcObject = stream; video.autoplay = true; video.playsInline = true;
        await new Promise(r => { video.onloadedmetadata = () => { video.play(); r(); }; });

        idle.classList.add('hidden');
        startTime = Date.now();
        loop();

        startBtn.innerHTML = '<span>■</span> Stop';
        startBtn.classList.remove('btn-primary');
        startBtn.onclick = stopCamera;
        recordBtn.disabled = false;
        dotCam.classList.add('on'); statCam.textContent = 'kamera on';
        setStatus('Siap');
        timerInterval = setInterval(() => {
          const e = Math.floor((Date.now()-startTime)/1000);
          statTimer.textContent = `${String(Math.floor(e/60)).padStart(2,'0')}:${String(e%60).padStart(2,'0')}`;
        }, 1000);
      } catch(e) { setStatus(`Error: ${e.message}`); }
    }

    function stopCamera() {
      if (animId) cancelAnimationFrame(animId);
      video?.srcObject?.getTracks().forEach(t => t.stop()); video = null;
      if (recording) stopRecording();
      clearInterval(timerInterval);
      idle.classList.remove('hidden');
      blurGlow.classList.remove('active'); hideBadge();
      filterBadge.style.display = 'none';
      startBtn.innerHTML = '<span>▶</span> Start';
      startBtn.classList.add('btn-primary'); startBtn.onclick = startCamera;
      recordBtn.disabled = true;
      dotCam.classList.remove('on'); statCam.textContent = 'kamera off';
      statTimer.textContent = '00:00'; setStatus('—');
    }

    // ═══ RECORDING ═══
    function startRecording() {
      const stream = canvas.captureStream(30);
      mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm' });
      chunks = [];
      mediaRecorder.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };
      mediaRecorder.onstop = () => {
        const blob = new Blob(chunks, { type: 'video/webm' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = `fotoblur_${Date.now()}.webm`; a.click();
        URL.revokeObjectURL(url); setStatus('Video tersimpan ✓');
      };
      mediaRecorder.start(); recording = true; startMusic();
      recordBtn.innerHTML = '<span>■</span> Stop Rec';
      recordBtn.classList.add('btn-danger');
      dotRec.classList.add('on'); statRec.textContent = 'rec';
      setStatus('Merekam...');
    }

    function stopRecording() {
      mediaRecorder?.state !== 'inactive' && mediaRecorder.stop();
      recording = false; stopMusic();
      recordBtn.innerHTML = '<span>⏺</span> Record';
      recordBtn.classList.remove('btn-danger');
      dotRec.classList.remove('on'); statRec.textContent = '—';
    }

    function setStatus(msg) { statusMsg.textContent = msg; }

    // ═══ EVENTS ═══
    startBtn.onclick = startCamera;
    recordBtn.onclick = () => recording ? stopRecording() : startRecording();

    // Load semua audio
    (async () => {
      musicBuffer  = await loadAudio('music.mp3');
      jokowiBuffer = await loadAudio('hidup-jokowi.mp3');
      antekBuffer  = await loadAudio('hey-antek-antek-asing-prabowo.mp3');
      if (musicBuffer || jokowiBuffer) setStatus('Audio siap ♪');
    })();

    // ═══ ENTRANCE ANIMATION ═══
    const noMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (!noMotion) {
      createTimeline({ ease: 'outExpo' })
        .add('#header',   { translateY: [-16,0], opacity: [0,1], duration: 600 })
        .add('#stage',    { translateY: [20,0],  opacity: [0,1], duration: 700 }, '-=400')
        .add('#controls', { translateY: [12,0],  opacity: [0,1], duration: 500 }, '-=400')
        .add('#statusBar',{ opacity: [0,1], duration: 400 }, '-=200')
        .add('.hint-card', { translateY: [16,0], opacity: [0,1], duration: 500, delay: stagger(70) }, '-=200');

      [startBtn, recordBtn].forEach(btn => {
        btn.addEventListener('mouseenter', () => { if (!btn.disabled) animate(btn, { scale: 1.03, duration: 180, ease: 'outQuad' }); });
        btn.addEventListener('mouseleave', () => { animate(btn, { scale: 1, duration: 200, ease: 'outQuad' }); });
      });
    } else {
      ['#header','#stage','#controls','#statusBar'].forEach(s => {
        const el = document.querySelector(s);
        el.style.opacity = '1'; el.style.transform = 'none';
      });
      document.querySelectorAll('.hint-card').forEach(c => { c.style.opacity='1'; c.style.transform='none'; });
    }
  </script>
</body>
</html>
